<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMap</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f2f5;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#toolbar {
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
}

#toolbar h1 {
  font-size: 17px;
  font-weight: 700;
  color: #2d3748;
  margin-right: 4px;
}

.btn {
  padding: 5px 12px;
  border: 1px solid #d0d0d0;
  border-radius: 5px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  color: #444;
  transition: background 0.1s;
}
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #4a90e2; color: #fff; border-color: #3a7bd5; }
.btn-primary:hover { background: #3a7bd5; }

#save-status {
  font-size: 12px;
  color: #aaa;
  margin-left: 4px;
}

#canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: default;
}

svg#map-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* node editor overlay */
#node-editor {
  position: absolute;
  display: none;
  border: 2px solid #4a90e2;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: #fff;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(74,144,226,0.3);
}

#shortcuts {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12px;
  display: flex;
  gap: 14px;
  pointer-events: none;
  white-space: nowrap;
}
#shortcuts b { color: #90cdf4; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>MindMap</h1>
  <button class="btn btn-primary" onclick="newMap()">New</button>
  <button class="btn" onclick="exportMap()">Export JSON</button>
  <button class="btn" onclick="document.getElementById('import-input').click()">Import JSON</button>
  <input id="import-input" type="file" accept=".json" style="display:none" onchange="importMap(event)">
  <span id="save-status">Saved</span>
</div>

<div id="canvas-container">
  <svg id="map-svg" tabindex="0">
    <defs>
      <filter id="sel-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4a90e2" flood-opacity="0.5"/>
      </filter>
      <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
      </filter>
    </defs>
    <g id="viewport">
      <g id="links"></g>
      <g id="nodes"></g>
    </g>
  </svg>
  <input id="node-editor" type="text" autocomplete="off" spellcheck="false">
</div>

<div id="shortcuts">
  <span><b>Tab</b> child</span>
  <span><b>Enter</b> sibling</span>
  <span><b>Del</b> delete</span>
  <span><b>Space / F2</b> edit</span>
  <span><b>↑↓←→</b> navigate</span>
  <span><b>Ctrl+↑↓</b> reorder</span>
  <span><b>/</b> collapse</span>
  <span><b>Ctrl+Z/Y</b> undo/redo</span>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const NW = 140;   // node width
const NH = 36;    // node height
const HS = 190;   // horizontal step between levels
const VG = 14;    // vertical gap between siblings

const PALETTE = [
  '#4a90e2','#e05d5d','#48bb78','#ed8936',
  '#9f7aea','#38b2ac','#f6ad55','#667eea'
];
